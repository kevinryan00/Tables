<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Addition Adventure</title><style>
:root{--purple:#6d28d9;--ink:#263449}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e2e8f0;background:linear-gradient(145deg,#0f172a,#172554 52%,#312e81);background-attachment:fixed;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill,button{border:0;border-radius:18px;padding:12px 16px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px #0002}.pill{background:#1e293b;color:#f8fafc;border:1px solid #ffffff22}.stats{display:flex;gap:8px}.hero{text-align:center}.rocket{font-size:70px;animation:bob 2.5s infinite}.hero h1{color:#f8fafc;font-size:clamp(38px,7vw,64px);margin:4px}.hero p{font-size:20px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.tableBtn{aspect-ratio:1;color:#fff;font-size:32px;border:1px solid #ffffff2b;background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 10px 30px #0005}.tableBtn.done:after{content:' ✓';font-size:18px}.card{background:#111827ee;border:1px solid #ffffff22;color:#f8fafc;border-radius:32px;padding:24px;box-shadow:0 15px 35px #0002}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact,.answer{background:#1e293b;color:#f8fafc;border:1px solid #ffffff22;font-size:22px}.answer{background:linear-gradient(135deg,#1d4ed8,#6d28d9);font-size:32px}.timerBox{margin:16px 0;padding:16px;border-radius:22px;background:#0f172acc;border:1px solid #ffffff22}.timerTitle{font-weight:900;margin-bottom:10px}.timerOptions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.timerHelp{font-size:12px;color:#94a3b8;margin:6px 0 12px}.timerChoice{font-size:18px;font-weight:900}.parentTimer{margin-top:18px;padding:18px;border-radius:22px;background:#ffffff12}.parentTimer input{width:90px;background:#0f172a;color:white;border:1px solid #ffffff33;border-radius:12px;padding:10px;font-size:18px;font-weight:800;text-align:center}.parentTimerActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.customChips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{background:#1e293b;color:#fff;border:1px solid #ffffff22;padding:8px 11px}.chip.active{background:#7c3aed;border-color:#a78bfa}.timerDanger{color:#fca5a5!important;border-color:#ef444466!important}@media(max-width:520px){.timerOptions{grid-template-columns:repeat(5,1fr);gap:5px}.timerBtn{padding:10px 5px;font-size:13px}}.timerBtn{background:#1e293b;color:#e2e8f0;border:2px solid #ffffff22;min-height:50px}.timerBtn.active{background:linear-gradient(135deg,#2563eb,#7c3aed);border-color:#93c5fd}.elapsed{font-variant-numeric:tabular-nums;background:#0f172a;color:#67e8f9;border:1px solid #22d3ee55;border-radius:14px;padding:9px 12px;font-weight:900;white-space:nowrap}.modeBox{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.modeBtn{background:#1e293b;color:#e2e8f0;border:2px solid #ffffff22}.modeBtn.active{background:linear-gradient(135deg,#2563eb,#7c3aed);border-color:#93c5fd}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.counterArea{margin:18px auto 6px;max-width:620px;padding:14px;border-radius:22px;background:#0f172acc;border:1px solid #ffffff20}.counterLabel{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-bottom:10px}.counterGroups{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.counterGroup{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:240px}.counter{width:25px;height:25px;border-radius:50%;box-shadow:inset 0 -4px 0 #0003,0 3px 8px #0004}.counter.a{background:linear-gradient(145deg,#38bdf8,#2563eb)}.counter.b{background:linear-gradient(145deg,#f472b6,#7c3aed)}.plusVisual{font-size:26px;font-weight:900;color:#f8fafc}.primary{width:100%;margin-top:18px;background:#7c3aed;color:#fff;font-size:20px}.green{background:#10b981}.progress{height:18px;background:#ffffffaa;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#facc15,#ec4899)}.parent{background:#111827;color:white}.parentGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#ffffff18;border-radius:22px;padding:16px}.rows{background:white;color:var(--ink);padding:18px;border-radius:24px;margin-top:18px}.row{display:grid;grid-template-columns:50px 1fr 90px;gap:10px;align-items:center;margin:10px 0}.track{height:13px;background:#e5e7eb;border-radius:20px;overflow:hidden}.fill{height:100%;background:#34d399}.profile{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0}.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#0ea5e9,#7c3aed);border:3px solid #fff3;box-shadow:0 8px 25px #0004}.avatarPicker{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.avatarPick{font-size:30px;padding:8px;background:#1e293b;border:2px solid transparent}.avatarPick.active{border-color:#60a5fa;background:#312e81}.badgeShelf{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.badge{border-radius:20px;padding:13px 8px;background:#1e293b;border:1px solid #ffffff1f;text-align:center}.badge.locked{filter:grayscale(1);opacity:.4}.badgeIcon{font-size:30px}.badgeTitle{font-size:12px;font-weight:900;margin-top:5px}.badgeNote{font-size:10px;color:#94a3b8;margin-top:3px}.timeUpOverlay{position:fixed;inset:0;z-index:45;background:#020617dd;backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px}.timeUpPanel{width:min(420px,100%);text-align:center;background:linear-gradient(145deg,#172554,#312e81);border:2px solid #f59e0b88;border-radius:30px;padding:28px;color:#fff;box-shadow:0 25px 60px #0008}.timeUpIcon{font-size:68px}.pauseOverlay{position:fixed;inset:0;z-index:50;background:#020617e8;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px}.pausePanel{width:min(430px,100%);text-align:center;background:#111827;border:1px solid #ffffff26;border-radius:30px;padding:30px;color:#f8fafc;box-shadow:0 25px 60px #0008}.pauseIcon{font-size:64px}.pauseActions{display:grid;gap:10px;margin-top:20px}.pauseActions button{min-height:54px}.hidden{display:none}@keyframes bob{50%{transform:translateY(-12px)}}@media(max-width:700px){body{min-height:100dvh}.wrap{padding:10px}.top{position:sticky;top:0;z-index:10;padding:6px 0;background:#0f172add;backdrop-filter:blur(8px)}.top button,.pill{padding:10px 11px;border-radius:14px}.stats{gap:5px}.hero h1{font-size:38px;line-height:1}.hero p{font-size:17px}.rocket{font-size:56px}.grid{grid-template-columns:repeat(3,1fr);gap:8px}.tableBtn{font-size:27px;border-radius:22px;min-height:76px}.facts{grid-template-columns:1fr 1fr;gap:8px}.fact{font-size:18px;padding:14px 7px;min-height:62px}.card{padding:16px;border-radius:24px}.answers{gap:9px}.answer{min-height:72px;font-size:30px}.primary{min-height:58px}.parentGrid{grid-template-columns:1fr 1fr}.stat{padding:13px}.rows{padding:14px}.row{grid-template-columns:38px 1fr 70px;gap:7px}.row b:last-child{font-size:12px}.parent h1{font-size:30px}.parent h2{font-size:20px}}
@media(max-width:700px){.badgeShelf{grid-template-columns:repeat(2,1fr)}.avatar{width:60px;height:60px;font-size:34px}}
@media(max-width:380px){.wrap{padding:7px}.top button,.pill{padding:8px;font-size:13px}.grid{gap:6px}.tableBtn{font-size:24px}.facts{grid-template-columns:1fr}.hero h1{font-size:34px}.row{grid-template-columns:34px 1fr 62px}}
</style></head><body><div class="wrap"><div class="top"><button onclick="home()">🏠 Home</button><div class="stats"><button id="sound" onclick="toggleSound()">🔊</button><span class="pill">⭐ <b id="stars">0</b></span><span class="pill">🔥 <b id="streak">0</b></span></div></div><div id="app"></div></div><script>
let screen='home',table=1,step=1,stars=0,streak=0,best=0,soundOn=true,answered=false,questionMode='order',questionOrder=Array.from({length:12},(_,i)=>i+1),paused=false,timeUp=false,timerMode='countdown',timerSeconds=10,timeLeft=10,timerId=null,timeoutOptions=[3,5,8,10,15],avatar='🧑‍🚀';
const avatars=['🧑‍🚀','🥷','🦸','🧙','🧑‍💻','🏄'];
const badges=[{icon:'🌟',title:'First Win',note:'Get 1 correct',test:()=>totalCorrect()>=1},{icon:'🔥',title:'Hot Streak',note:'5 in a row',test:()=>best>=5},{icon:'🎯',title:'Sharp Shooter',note:'80% accuracy',test:()=>totalTried()>=10&&accuracy()>=80},{icon:'🏆',title:'Table Master',note:'Finish a table',test:()=>completedCount()>=1},{icon:'💎',title:'Five Alive',note:'Finish 5 tables',test:()=>completedCount()>=5},{icon:'👑',title:'Addition Ace',note:'Finish all 12',test:()=>completedCount()>=12},{icon:'⚡',title:'50 Club',note:'50 correct',test:()=>totalCorrect()>=50},{icon:'🚀',title:'100 Club',note:'100 correct',test:()=>totalCorrect()>=100}];let data={};for(let i=1;i<=12;i++)data[i]={attempted:0,correct:0,completed:false};
const app=document.getElementById('app');function tone(f=440,d=.12,delay=0){if(!soundOn)return;try{let C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d)}catch(e){}}function correctSound(){[523,659,784].forEach((f,i)=>tone(f,.15,i*.11))}function wrongSound(){tone(220,.15);tone(175,.18,.12)}function winSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,i*.13))}function speak(t){if(soundOn&&speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}function updateTop(){starsEl.textContent=stars;streakEl.textContent=streak}const starsEl=document.getElementById('stars'),streakEl=document.getElementById('streak');function toggleSound(){soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊':'🔇'}function home(){stopTimer();screen='home';render()}
function totalTried(){return Object.values(data).reduce((s,p)=>s+p.attempted,0)}function totalCorrect(){return Object.values(data).reduce((s,p)=>s+p.correct,0)}function completedCount(){return Object.values(data).filter(p=>p.completed).length}function accuracy(){return totalTried()?Math.round(totalCorrect()/totalTried()*100):0}function badgeHTML(){return badges.map(b=>`<div class="badge ${b.test()?'':'locked'}"><div class="badgeIcon">${b.icon}</div><div class="badgeTitle">${b.title}</div><div class="badgeNote">${b.test()?'Unlocked!':b.note}</div></div>`).join('')}function pickAvatar(a){avatar=a;tone(660,.08);render()}function fmtTime(sec){return String(Math.max(0,sec)).padStart(2,'0')}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}function startTimer(){stopTimer();if(screen==='play'&&!paused){timerId=setInterval(()=>{timeLeft=Math.max(0,timeLeft-1);let e=document.getElementById('elapsed');if(e){e.textContent=fmtTime(timeLeft);e.parentElement.classList.toggle('timerDanger',timeLeft<=3)}if(timeLeft===0){stopTimer();wrongSound();timeUp=true;render()}},1000)}}function addTimeoutOption(){let el=document.getElementById('customSeconds'),v=parseInt(el?.value,10);if(!Number.isFinite(v)||v<1||v>120)return;timeoutOptions=[...new Set([...timeoutOptions,v])].sort((a,b)=>a-b);timerSeconds=v;timeLeft=v;tone(660,.08);render()}function removeTimeoutOption(v){if(timeoutOptions.length<=1)return;timeoutOptions=timeoutOptions.filter(x=>x!==v);if(timerSeconds===v){timerSeconds=timeoutOptions[0];timeLeft=timerSeconds}render()}function resetTimeoutOptions(){timeoutOptions=[3,5,8,10,15];timerSeconds=10;timeLeft=10;render()}function setCountdown(sec){timerSeconds=sec;timeLeft=sec;timeUp=false;tone(660,.08);render()}function resetCountdown(){timeLeft=timerSeconds;timeUp=false;startTimer();render()}function retryTimedQuestion(){timeUp=false;timeLeft=timerSeconds;render();startTimer()}function skipTimedQuestion(){timeUp=false;if(step===12){data[table].completed=true;screen='win';winSound()}else{step++;timeLeft=timerSeconds;render();startTimer()}}function togglePause(){paused=!paused;if(paused&&window.speechSynthesis)window.speechSynthesis.cancel();tone(440,.06);render()}function quitChallenge(){paused=false;stopTimer();screen='home';render()}function render(){if(screen==='home')renderHome();if(screen==='learn')renderLearn();if(screen==='play')renderPlay();if(screen==='win')renderWin();if(screen==='parent')renderParent()}
function renderHome(){app.innerHTML=`<section class="hero"><div class="rocket">⚡</div><h1>Addition Quest!</h1><div class="profile"><div class="avatar">${avatar}</div><div style="text-align:left"><b>Player One</b><br><small>${badges.filter(b=>b.test()).length}/8 badges unlocked</small></div></div><div class="avatarPicker">${avatars.map(a=>`<button class="avatarPick ${a===avatar?'active':''}" onclick="pickAvatar('${a}')">${a}</button>`).join('')}</div><p>Choose a level, sharpen your skills and build your best streak.</p><div class="grid">${Array.from({length:12},(_,i)=>`<button class="tableBtn ${data[i+1].completed?'done':''}" onclick="learn(${i+1})">+${i+1}</button>`).join('')}</div><button style="margin-top:24px;background:#1f2937;color:white" onclick="screen='parent';render()">📊 Parent Progress</button></section>`}
function setMode(m){questionMode=m;questionOrder=m==='random'?Array.from({length:12},(_,i)=>i+1).sort(()=>Math.random()-.5):Array.from({length:12},(_,i)=>i+1);tone(660,.08);render()}function learn(n){table=n;step=1;questionOrder=questionMode==='random'?Array.from({length:12},(_,i)=>i+1).sort(()=>Math.random()-.5):Array.from({length:12},(_,i)=>i+1);screen='learn';tone(520,.07);render()}function renderLearn(){app.innerHTML=`<section class="hero"><div style="font-size:55px">🎯</div><h1 style="font-size:42px">The +${table} Table</h1><p>Tap a card to hear it out loud.</p><div class="timerBox"><div class="timerTitle">⏱ Countdown per question</div><div class="timerHelp">Choose how many seconds you want for each sum.</div><div class="timerOptions">${timeoutOptions.map(t=>`<button class="timerBtn ${timerSeconds===t?'active':''}" onclick="setCountdown(${t})"><span class="timerChoice">${t}</span><br>sec</button>`).join('')}</div></div><div class="modeBox"><button class="modeBtn ${questionMode==='order'?'active':''}" onclick="setMode('order')">🔢 In Order</button><button class="modeBtn ${questionMode==='random'?'active':''}" onclick="setMode('random')">🔀 Jumble Them Up</button></div><div class="facts">${Array.from({length:12},(_,i)=>`<button class="fact" onclick="tone(520,.07);speak('${table} plus ${i+1} equals ${table+i+1}')"><b style="color:#7c3aed">${table}</b> + ${i+1} = <b style="color:#059669">${table+i+1}</b> 🔊</button>`).join('')}</div><button class="primary" onclick="step=1;timeLeft=timerSeconds;questionOrder=questionMode==='random'?Array.from({length:12},(_,i)=>i+1).sort(()=>Math.random()-.5):Array.from({length:12},(_,i)=>i+1);screen='play';render();startTimer()">Start Challenge ⚡</button></section>`}
function opts(c){let a=[c];for(let x=1;a.length<4;x++){let v=Math.max(2,c+(x%2?x:-x));if(!a.includes(v))a.push(v)}return a.sort(()=>Math.random()-.5)}function renderPlay(){answered=false;let q=questionOrder[step-1],c=table+q,o=opts(c);app.innerHTML=`${timeUp?`<div class="timeUpOverlay"><div class="timeUpPanel"><div class="timeUpIcon">⏰</div><h1>Time's Up!</h1><p>No problem. Give this sum another go, or move to the next one.</p><div class="pauseActions"><button class="primary green" style="margin:0" onclick="retryTimedQuestion()">↻ Try Again</button><button onclick="skipTimedQuestion()">Next Question →</button></div></div></div>`:``}<div style="display:flex;align-items:center;gap:10px"><div class="progress" style="flex:1"><div class="bar" style="width:${step/12*100}%"></div></div><div class="elapsed ${timeLeft<=3?'timerDanger':''}">⏳ <span id="elapsed">${fmtTime(timeLeft)}</span>s</div><button onclick="togglePause();${paused?'startTimer()':'stopTimer()'}" style="background:#1e293b;color:white;white-space:nowrap">⏸ Pause</button></div><p style="text-align:center;font-weight:800">Question ${step} of 12 · ${questionMode==='random'?'Jumbled':'In order'}</p>${paused?`<div class="pauseOverlay"><div class="pausePanel"><div class="pauseIcon">⏸️</div><h1>Challenge Paused</h1><p>Take a breather. Your question and progress are waiting for you.</p><div class="pauseActions"><button class="primary green" style="margin:0" onclick="togglePause()">▶ Resume Challenge</button><button onclick="quitChallenge()">🏠 Save progress & return home</button></div></div></div>`:``}<div class="card hero"><div style="font-size:55px" id="face">🧠</div><h1 style="font-size:clamp(44px,8vw,72px);color:#263449">${table} + ${q} = <span style="color:#7c3aed">?</span></h1><button onclick="speak('${table} plus ${q} equals what?')">🔊 Hear question</button><div class="counterArea"><div class="counterLabel">Count the counters</div><div class="counterGroups"><div class="counterGroup">${Array.from({length:table},()=>`<span class="counter a"></span>`).join('')}</div><div class="plusVisual">+</div><div class="counterGroup">${Array.from({length:q},()=>`<span class="counter b"></span>`).join('')}</div></div></div><div class="answers">${o.map(v=>`<button class="answer" onclick="choose(${v},this)">${v}</button>`).join('')}</div><h2 id="msg"></h2><button id="next" class="primary green hidden" onclick="next()">${step===12?'See my prize!':'Next question →'}</button></div>`}
function choose(v,b){if(answered)return;stopTimer();data[table].attempted++;let q=questionOrder[step-1],c=table+q;if(v===c){answered=true;data[table].correct++;stars++;streak++;best=Math.max(best,streak);correctSound();document.getElementById('face').textContent='⚡';document.getElementById('msg').textContent=['Brilliant!','Amazing!','Super star!','You got it!'][Math.floor(Math.random()*4)];b.style.background='#a7f3d0';document.getElementById('next').classList.remove('hidden');speak(`${table} plus ${q} equals ${c}. Well done!`)}else{streak=0;wrongSound();document.getElementById('face').textContent='🎯';document.getElementById('msg').textContent='Nearly! Try again.'}updateTop()}
function next(){tone(520,.07);if(step===12){data[table].completed=true;stopTimer();screen='win';winSound()}else {step++;timeLeft=timerSeconds;render();startTimer()}}function renderWin(){app.innerHTML=`<section class="hero"><div class="avatar" style="margin:16px auto">${avatar}</div><div style="font-size:90px">🏆</div><h1>Challenge Complete!</h1><p>You completed the +${table} table!</p><button class="primary" onclick="home()">Choose another table</button></section>`}
function renderParent(){let arr=Object.values(data),attempted=arr.reduce((s,p)=>s+p.attempted,0),correct=arr.reduce((s,p)=>s+p.correct,0),complete=arr.filter(p=>p.completed).length,acc=attempted?Math.round(correct/attempted*100):0;let tried=Object.entries(data).filter(([n,p])=>p.attempted),focus=tried.length?tried.sort((a,b)=>a[1].correct/a[1].attempted-b[1].correct/b[1].attempted)[0][0]:null;app.innerHTML=`<div class="card parent"><h1>Parent Dashboard</h1><h2>Learning Progress</h2><div class="parentGrid"><div class="stat"><b>${attempted}</b><br>Questions tried</div><div class="stat"><b>${correct}</b><br>Correct answers</div><div class="stat"><b>${acc}%</b><br>Accuracy</div><div class="stat"><b>${best}</b><br>Best streak</div></div><div class="rows"><h2>Addition tables <span style="float:right;color:#7c3aed">${complete}/12 complete</span></h2>${Object.entries(data).map(([n,p])=>{let a=p.attempted?Math.round(p.correct/p.attempted*100):0;return `<div class="row"><b>+${n}</b><div class="track"><div class="fill" style="width:${p.attempted?Math.max(a,5):0}%"></div></div><b>${p.attempted?a+'%':'Not tried'}</b></div>`}).join('')}</div><div class="parentTimer"><h2 style="margin:0">⏱ Countdown Settings</h2><p style="color:#cbd5e1">Choose which countdown choices appear for the child. Add any time from 1 to 120 seconds.</p><div class="customChips">${timeoutOptions.map(t=>`<button class="chip ${timerSeconds===t?'active':''}" onclick="setCountdown(${t})">${t}s</button><button class="chip" aria-label="Remove ${t} seconds" onclick="removeTimeoutOption(${t})">×</button>`).join('')}</div><div class="parentTimerActions"><input id="customSeconds" type="number" min="1" max="120" value="20" aria-label="Custom seconds"><button onclick="addTimeoutOption()">+ Add time</button><button onclick="resetTimeoutOptions()">Reset defaults</button></div></div><div style="margin-top:18px"><h2>Badge Collection</h2><div class="badgeShelf">${badgeHTML()}</div></div><div style="background:#7c3aed;border-radius:22px;padding:18px;margin-top:18px"><b>Suggested focus</b><h3>${focus?'Practise the +'+focus+' table next.':'Complete a Star Challenge to start tracking progress.'}</h3></div><button style="margin-top:16px" onclick="resetProgress()">Reset Progress</button></div>`}function resetProgress(){for(let i=1;i<=12;i++)data[i]={attempted:0,correct:0,completed:false};stars=streak=best=0;updateTop();renderParent()}render();
</script></body></html>
